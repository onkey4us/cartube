name: Build CarTube APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CarTube
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch MediaServiceCore & SharedModules
        run: |
          if [ ! -f MediaServiceCore/core_settings.gradle ]; then
            rm -rf MediaServiceCore
            git clone --recursive --depth 1 https://github.com/yuliskov/MediaServiceCore.git MediaServiceCore
          fi
          if [ ! -f SharedModules/constants.gradle ]; then
            rm -rf SharedModules
            cp -R MediaServiceCore/SharedModules SharedModules
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;30.0.3 platform-tools'

      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Cache Android Debug Keystore (Keep Consistent Signature)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cartube-debug-keystore-v1

      - name: Ensure Android Debug Keystore Exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APKs (arm64-v8a, armeabi-v7a, universal)
        run: gradle :app:assembleRelease --stacktrace

      - name: List Built APKs
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload CarTube APKs
        uses: actions/upload-artifact@v4
        with:
          name: CarTube-APKs
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

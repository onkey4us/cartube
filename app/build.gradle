apply from: '../SharedModules/constants.gradle'
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34
    buildToolsVersion project.ext.buildToolsVersion

    defaultConfig {
        applicationId "app.revanced.android.youtube"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 13
        versionName "1.1.1"

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        // Match :youtubeapi productFlavor dimension ("default": stbeta / ststable / stfdroid)
        missingDimensionStrategy 'default', 'ststable'
    }

    signingConfigs {
        release {
            // Uses release keystore from env vars if provided in CI, otherwise falls back to debug keystore
            // so the built APK is immediately installable via `adb install`.
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null && new File(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            // Build arm64-v8a only for Beijing X7 C3005H_MX8Q (cuts CI artifact size from 96 MB -> 22 MB)
            include 'arm64-v8a'
            universalApk false
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/LICENSE.md',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE.md',
                'META-INF/DEPENDENCIES',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Core YouTube engine from SmartTube's MediaServiceCore (ad-free InnerTube, OAuth2, SponsorBlock)
    implementation project(':mediaserviceinterfaces')
    implementation project(':youtubeapi')
    implementation project(':sharedutils')

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Coroutines & RxJava2 (bridging MediaServiceCore Observables)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // AndroidX Media3 (ExoPlayer + DASH + HLS + Cronet QUIC/HTTP2 + MediaSession for steering-wheel controls)
    def media3Version = '1.2.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation 'org.chromium.net:cronet-api:' + cronetApiVersion
    implementation("androidx.media3:media3-datasource-cronet:$media3Version") {
        exclude group: 'org.chromium.net'
    }
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation 'com.google.guava:guava:31.1-android'

    // Lightweight thumbnail loader & QR generator for OAuth2 TV login
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.google.zxing:core:3.5.1'
}
